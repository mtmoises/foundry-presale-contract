[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[lint]
exclude_lints = [
    "missing-zero-check",
    "block-timestamp",
    "arbitrary-send-eth",
    "divide-before-multiply",
    "reentrancy-events",
    "unused-return",
    "unsafe-typecast"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options


